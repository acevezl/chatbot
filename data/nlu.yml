# This file describes "What users say"
# Here, we define intents (i.e., user goals)
# These are examples so that RASA can generalize
# Per the class:
# - We should set examples here
# - We should add examples over time
# - Keep intents CLEAN and DISTINCT
# - Do not mix different meanings into one intent

version: "3.1"

