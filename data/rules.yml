version: "3.1"

rules:

# Greeting / Goodbye Rules
- rule: Greet customers on conversation start
  # RASA CLI Behavior: This does not work on the CLI - This is normal (checked with prof Juan & Documentation)
  conversation_start: true
  steps:
    - action: utter_greet

- rule: Greet customers when they greet you
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye when the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye


# Order Pizza Rules
- rule: Start order
  steps:
    - intent: start_order
    - action: action_start_restart_order
    - action: utter_start_order

- rule: Add pizza item
  steps:
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order

- rule: Add drink item
  steps:
    - intent: add_drink_to_order
    - action: action_add_drink_to_order

- rule: User asks for order summary
  steps:
    - intent: summarize_order
    - action: action_confirm_order
    # utter_confirm is on  action.py - action_confirm_order

- rule: User is done ordering
  steps:
    - intent: done_ordering
    - action: action_confirm_order
    # utter_confirm is on  action.py - action_confirm_order

- rule: User confirms final order
  steps:
    - intent: confirm_order
    - action: action_submit_order
    # utter pickup code is on action.py - action_submit_order
    - action: utter_goodbye

- rule: User rejects final order
  steps:
    - intent: deny_order
    - action: action_start_restart_order
    - action: utter_restart_order

- rule: Continue order after user provides missing info
  steps:
    - intent: inform
    - action: action_add_pizza_to_order
    # utter_what_else is on action.py - action_add_pizza_to_order only when info is complete and pizza was added

# Respuesta for defecto
- rule: Fallback
  steps:
    - intent: nlu_fallback
    - action: utter_default