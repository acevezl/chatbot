# This file describes how conversations flow
# (i.e., it teaches the bot what to do next)
# The RASA bot learns patterns like:
# - greet -> respond
# - ask question -> give answer


version: "3.1"


stories:
- story: Happy path
  steps:
    - intent: greet
    - action: utter_greet
    - intent: start_order
    - action: action_start_restart_order
    - action: utter_start_order
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order
    - intent: add_drink_to_order
    - action: action_add_drink_to_order
    - intent: done_ordering
    - action: action_confirm_order
    - action: utter_confirm
    - intent: confirm_order
    - action: action_submit_order
    - action: utter_goodbye

- story: Start order without greeting
  steps:
    - intent: start_order
    - action: action_start_restart_order
    - action: utter_start_order
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order
    - intent: done_ordering
    - action: action_confirm_order
    - action: utter_confirm
    - intent: confirm_order
    - action: action_submit_order
    - action: utter_goodbye

- story: User starts with pizza directly
  steps:
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order
    - intent: done_ordering
    - action: action_confirm_order
    - action: utter_confirm
    - intent: confirm_order
    - action: action_submit_order
    - action: utter_goodbye

- story: User starts with drink directly
  steps:
    - intent: add_drink_to_order
    - action: action_add_drink_to_order
    - intent: done_ordering
    - action: action_confirm_order
    - action: utter_confirm
    - intent: confirm_order
    - action: action_submit_order
    - action: utter_goodbye

- story: Multiple pizzas and drinks
  steps:
    - intent: start_order
    - action: action_start_restart_order
    - action: utter_start_order
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order
    - intent: add_drink_to_order
    - action: action_add_drink_to_order
    - intent: done_ordering
    - action: action_confirm_order
    - action: utter_confirm
    - intent: confirm_order
    - action: action_submit_order
    - action: utter_goodbye

- story: User rejects final order
  steps:
    - intent: start_order
    - action: action_start_restart_order
    - action: utter_start_order
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order
    - intent: done_ordering
    - action: action_confirm_order
    - action: utter_confirm
    - intent: deny_order
    - action: action_start_restart_order
    - action: utter_restart_order


# Stories to ask for information about the menu (pizza types, sizes, and drinks)
- story: Ask pizza sizes
  steps:
    - intent: ask_pizza_sizes
    - action: utter_pizza_sizes

- story: Ask drink types
  steps:
    - intent: ask_drink_types
    - action: utter_drink_types

- story: Ask promotions
  steps:
    - intent: ask_promotions
    - action: utter_promotions

- story: Ask opening hours
  steps:
    - intent: ask_opening_hours
    - action: utter_opening_hours

# Stories to show interruptions in the flow
- story: Pizzus interruptus - Pizza types
  # Customer asks for the menu instead of asking for pizzas in the middle of the happy path
  steps:
    - intent: greet
    - action: utter_greet
    - intent: start_order
    - action: action_start_restart_order
    - action: utter_start_order
    - intent: ask_pizza_types
    - action: utter_pizza_types
    - action: utter_start_order
    - intent: add_pizza_to_order
    - action: action_add_pizza_to_order
    - intent: add_drink_to_order
    - action: action_add_drink_to_order
    - intent: done_ordering
    - action: action_confirm_order
    - action: utter_confirm
    - intent: confirm_order
    - action: action_submit_order
    - action: utter_goodbye