# This file describes how conversations flow
# (i.e., it teaches the bot what to do next)
# The RASA bot learns patterns like:
# - greet -> respond
# - ask question -> give answer


version: "3.1"

stories:
- story: order pizza
  steps:
    - intent: order_pizza
    - action: pizza_type_form
    - active_loop: pizza_type_form
    - active_loop: null
    - action: action_confirm_pizza_type_order

- story: order drinks
  steps:
    - intent: order_drinks
    - action: drinks_form
    - active_loop: drinks_form
    - active_loop: null
    - action: action_confirm_drinks

- story: ask pizza sizes
  steps:
    - intent: ask_pizza_sizes
    - action: utter_pizza_sizes

- story: ask pizza types
  steps:
    - intent: ask_pizza_types
    - action: utter_pizza_types

- story: ask drink types
  steps:
    - intent: ask_drink_types
    - action: utter_drink_types

- story: ask opening hours
  steps:
    - intent: ask_opening_hours
    - action: utter_opening_hours