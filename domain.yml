# This file describes "What exists in the bot's world"
# (i.e., this is the source of truth of the bot)
# Per the class... this file defines:
# - Intents (must match the nly.yaml)
# - Responses (what bots can say)
# - Entities, slots (state/memory)
# - Actions (custom logic)
# If something isn't in the domain.yml, it doesn't exist for the bot

version: "3.1"

intents:
  # Greet / Goodbye intents
  - greet
  - goodbye
  # Intents for placing a pizza / drinks order
  - start_order
  - add_pizza_to_order
  - add_drink_to_order
  - inform
  - done_ordering
  - confirm_order
  - deny_order
  - restart_order
  - summarize_order
  # Intents for asking for information
  - ask_opening_hours
  - ask_pizza_sizes
  - ask_pizza_types
  - ask_drink_types
  - ask_promotions
  # These ones were part of the initial template... 
  - bot_challenge
  - mood_great
  - mood_unhappy


entities:
  - pizza_size
  - pizza_type
  - drink


slots:
  # Slots para pedir la orden (temporal)
  pizza_type:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: pizza_type
      conditions:
          - active_loop: pizza_form
            requested_slot: pizza_type

  pizza_size:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: pizza_size
        conditions:
          - active_loop: pizza_form
            requested_slot: pizza_size

  drink:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: drink
      conditions:
        - active_loop: drink_form
          requested_slot: drink

  # Slots para llevar la cuenta de la orden (long-term)
  order_items:
    type: list
    mappings:
      - type: custom

  order_total:
    type: float
    mappings:
      - type: custom

  order_started:
    type: bool
    mappings:
      - type: custom

  # Slot para preservar el pickup code
  pickup_code:
    type: text
    mappings:
      - type: custom

forms:
  order_form:
    required_slots:
      - order_items
    
  pizza_form:
    required_slots:
      - pizza_type
      - pizza_size
  
  drink_form:
    required_slots:
      - drink


responses:
  # Greet / Goodbye
  utter_greet:
  - text: "Mamma mia! Welcome to Luigi-and-Dany's Pizzeria!\nI'm a Pizza Bot, how can I help you today?\nYou can place an order or ask about our pizzas, sizes, drinks, promotions, and opening hours."

  utter_goodbye:
  - text: "Ciao! Come back soon for more delicious pizza and drinks from Luigi-and-Dany's Pizzeria!"

  # Order
  utter_start_order:
    - text: "Alright, let's start your order. What would you like?"

  utter_ask_pizza_size:
    - text: "What size would you like? (Small, Medium, Large)"

  utter_ask_pizza_type:
    - text: "We have Margherita, Marinara, Hawaiian, Veggie, or Funghi, what would you like?"

  utter_ask_drink_type:
    - text: "We have Coke, Fanta, and Pibb. What would you like?"
  
  utter_ask_what_else:
    - text: "Alright. What else can I get you?"
  
  utter_empty_order:
    - text: "It seems you haven't ordered anything. What can I get you?"

  utter_confirm:
    - text: "Should I place this order?"

  utter_restart_order: 
    - text: "Alright. Let's start over, what can I get you?"
  
  # Information
  utter_pizza_sizes:
    - text: "We make small (12 €), medium (14 €) and large (18 €) pizzas"

  utter_pizza_types:
    - text: "We make Margherita, Marinara, Hawaiian, Veggie, or Funghi."

  utter_drink_types:
    - text: "We have Coke, Fanta, and Pibb, all drinks are 3 €"

  utter_promotions:
    - text: "All margherita pizzas of all sizes are 2 € off!"

  utter_opening_hours:
    - text: "We are open every day from 13:00 to 22:00"


  # Default
  utter_iamabot:
    - text: "Mamma mia! I am-a a bot-a, powered by Rasa"

  utter_default:
    - text: "Sorry, I didn't understand-a. I'm a Pizza Bot from Luigi-and-Dany's Pizzeria.\nYou can place an order or ask about pizzas, sizes, drinks, and opening hours."


actions:
  # Start order / Restart si el usario dice que no está bien
  - action_start_restart_order
  # Add pizza to order
  - action_add_pizza_to_order
  # Add drink to order
  - action_add_drink_to_order
  # Show order and ask user to confirm
  - action_confirm_order
  # Submit confirmed order
  - action_submit_order

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true